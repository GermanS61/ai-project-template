name: Feature Request
description: Предложить новый пользовательский или продуктовый функционал
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Идея не является разрешением на разработку. После отправки владелец проекта проведёт triage и назначит статус в GitHub Project.
  - type: textarea
    id: problem
    attributes:
      label: Проблема
      description: Какую реальную проблему нужно решить?
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Для кого
      description: Кто и в каком сценарии будет использовать функцию?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предложение
      description: Какой результат или поведение желательно получить?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Польза и ожидаемый спрос
      description: Почему функция полезна и насколько может быть востребована?
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Можно ли решить проблему существующим функционалом или проще?
  - type: textarea
    id: technical
    attributes:
      label: Предварительное техническое влияние
      description: Модули, API, данные, интеграции, риски — если уже известно.

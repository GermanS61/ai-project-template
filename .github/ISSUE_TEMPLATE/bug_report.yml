name: Bug Report
description: Сообщить о воспроизводимой ошибке
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Что происходит
      description: Фактическое поведение и сообщение об ошибке.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: Версия, OS/runtime, relevant configuration без секретов.
  - type: textarea
    id: evidence
    attributes:
      label: Логи / дополнительные данные
      description: Не публикуйте secrets и credentials.
